<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RevisionDeck</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="wrap"><header class="hero"><h1>🧠 RevisionDeck</h1><p>Build a revision habit with active recall and spaced repetition.</p><div id="stats"></div></header><section class="panel"><h2>Create a flashcard</h2><form id="create"><input name="deck" placeholder="Subject / deck" required><input name="question" placeholder="Question" required><input name="answer" placeholder="Answer" required><button>Add card</button></form></section><section class="panel"><h2>Cards due for review</h2><div id="cards" class="items"></div></section></main><script>
const el=id=>document.getElementById(id);
async function api(url,opts={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});let d=r.status===204?null:await r.json();if(!r.ok)throw Error(d?.error||'Request failed');return d}
async function load(){let [cards,s]=await Promise.all([api('/api/cards'),api('/api/stats')]);el('stats').textContent=s.due+' due · '+s.total+' cards · '+s.decks+' decks';el('cards').innerHTML=cards.filter(c=>c.due_on<=new Date().toISOString().slice(0,10)).map(c=>'<article class="item"><div><span class="pill">'+esc(c.deck)+'</span><h3>'+esc(c.question)+'</h3><p class="muted" id="a'+c.id+'" hidden>'+esc(c.answer)+'</p><small class="muted">Due '+c.due_on+' · '+c.reviews+' reviews</small></div><div class="actions"><button class="secondary" onclick="show('+c.id+')">Reveal</button><button onclick="rate('+c.id+',\'good\')">Good</button><button onclick="rate('+c.id+',\'easy\')">Easy</button><button class="secondary" onclick="rate('+c.id+',\'again\')">Again</button><button class="danger" onclick="removeCard('+c.id+')">Delete</button></div></article>').join('')||'<div class="empty">Nothing due today. Add a card to get started!</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(id){el('a'+id).hidden=false}
async function rate(id,rating){try{await api('/api/cards/'+id+'/review',{method:'POST',body:JSON.stringify({rating})});load()}catch(e){alert(e.message)}}
async function removeCard(id){if(confirm('Delete this card?')){await api('/api/cards/'+id,{method:'DELETE'});load()}}
el('create').onsubmit=async e=>{e.preventDefault();try{await api('/api/cards',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();load()}catch(err){alert(err.message)}};
load();
</script></body></html>
